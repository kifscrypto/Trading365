appId: org.trading365.desk
productName: T365 Terminal
directories:
  output: release
files:
  - dist/**/*
extraResources:
  - from: src/renderer
    to: renderer
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  artifactName: T365-Terminal-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: T365 Terminal
